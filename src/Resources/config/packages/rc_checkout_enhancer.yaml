# Eigene Begrenzung für den Versandkostenrechner.
#
# Der Endpunkt ist ohne Anmeldung erreichbar und löst je Aufruf so viele
# Warenkorb-Berechnungen aus, wie der Kanal Versandarten hat. Ohne Begrenzung
# genügt eine Schleife, um den Shop zu beschäftigen.
#
# Die Staffel ist bewusst großzügiger als beim Login: Wer ausprobiert, wohin er
# liefern lassen kann, tippt mehrere Länder hintereinander durch. Erst wer das
# in Maschinengeschwindigkeit tut, läuft in die Sperre.
shopware:
    api:
        rate_limiter:
            rc_checkout_shipping_estimate:
                enabled: true
                policy: 'time_backoff'
                reset: '1 hour'
                limits:
                    - limit: 20
                      interval: '30 seconds'
                    - limit: 40
                      interval: '120 seconds'
